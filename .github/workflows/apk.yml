name: Compilar APK

on:
  push:
    branches: [ordinario]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: [UltimaCarta, CloneWhatsApp, MyFirstAndroidApp, MySumApp, PersistenciaAndroid, CustomPassEmailRecovery]
    defaults:
      run:
        working-directory: ${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        if: matrix.proyecto == 'UltimaCarta'
        run: chmod +x gradlew && ./gradlew testDebugUnitTest

      - name: Compilar APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.proyecto }}-apk
          path: ${{ matrix.proyecto }}/app/build/outputs/apk/debug/*.apk
